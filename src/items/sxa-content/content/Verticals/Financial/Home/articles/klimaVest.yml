    - ID: "3e700dce-26eb-4bf0-990f-9d9fe555990d"
      Hint: Excerpt
      Value: "Commerz Real has secured a new wind farm in the Irish Midlands for its klimaVest fund. The acquisition of Moanvane wind farm in County Offaly marks the entry into the Irish renewables market for klimaVest. The wind farm has been in operation since the end of September 2024 and is located about a 90-minute drive west of Dublin. It comprises twelve Nordex turbines with an installed capacity of 57.6 megawatts (MW). The wind farm provides the fund with guaranteed remuneration based on a 15-year corporate power purchase agreement (corporate PPA)."
