    - ID: "03117268-f84f-4fd8-ad9e-5990b3a21fe6"
      Hint: Content
      Value: |
        <div class="ck-content"><p>With this strategic acquisition&nbsp;klimaVest is further diversifying its real asset portfolio of renewable energies i<strong>n Europe.</strong></p><p>Ireland is a very attractive location thanks to its unique and favourable wind conditions which come close to offshore environments. Wind energy is accounting for a third of the country’s power supply and has developed to an increasingly relevant contributor to Ireland’s energy mix.&nbsp;</p><p>In addition to Ireland, klimaVest holds investments in 43 solar and wind parks in Germany, Finland, Sweden, France and Spain.<br /><br />Moanvane wind farm has been developed and sold by Statkraft, Europe’s largest generator of renewable energy. Statkraft are to remain involved and will continue to provide operational management services. The site also includes an amenity trail, which is currently under construction and due for completion early next year. The 6 km trail will be open to the public and will offer a safe walking route, while integrating biodiversity measures to enhance the local eco-system.</p><p><br /><br />With the launch of klimaVest&nbsp;in 2020, Commerz Real became one of the pioneers in the field of open-ended renewable energy infrastructure funds for private investors. klimaVest&nbsp;currently has a total of 1.4 billion euros in assets under management and since its launch has been delivering steady returns independent of the stock market environment to its investors. The fund enables private investors to invest in real renewable energy projects that are essential to the transformation of the European economy.</p></div>
